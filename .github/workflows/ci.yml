name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression-dashboard:
    name: Regression dashboard checks
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: apps/regression-dashboard
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/regression-dashboard/requirements-dev.txt
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Run unit tests
        run: python -m pytest -q
      - name: Compile Python
        run: python -m compileall -q app
      - name: Check frontend JavaScript
        run: node --check app/static/app.js

  docker:
    name: Regression dashboard Docker build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v4
      - name: Build production image
        uses: docker/build-push-action@v7
        with:
          context: apps/regression-dashboard
          file: apps/regression-dashboard/Dockerfile
          push: false
          tags: alfabank-contractor-regression:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

